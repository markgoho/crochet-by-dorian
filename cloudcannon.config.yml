source: /hugo/
collections_config:
  products:
    path: content/products
    name: Products
    icon: groups
  shop:
    path: content/shop
    name: Shop
    icon: shop
paths:
  static: static
  uploads: static/uploads
timezone: America/New_York
markdown:
  engine: commonmark
  options:
    gfm: true
    linkify: false
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    breaks: false
    xhtml: false
    attributes: false
    typographer: false
    treat_indentation_as_code: true
_snippets_imports:
  hugo:
    exclude:
      - hugo_instagram
